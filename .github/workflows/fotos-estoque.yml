name: fotos-estoque
on:
  push:
    branches: [fotos-estoque]
    paths: ['cnpj.txt','.github/workflows/fotos-estoque.yml']
permissions:
  contents: write
jobs:
  cnpj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta CNPJ BrasilAPI
        shell: bash {0}
        run: |
          mkdir -p cnpj; : > cnpj_falhas.txt
          while read -r c; do
            [ -z "$c" ] && continue
            [ -s "cnpj/$c.json" ] && continue
            for t in 1 2 3; do
              code=$(curl -s -o "cnpj/$c.json" -w '%{http_code}' --max-time 30 "https://brasilapi.com.br/api/cnpj/v1/$c")
              [ "$code" = "200" ] && break
              sleep 5
            done
            [ "$code" = "200" ] || echo "$c $code" >> cnpj_falhas.txt
            sleep 1.5
          done < cnpj.txt
          ls cnpj | wc -l; cat cnpj_falhas.txt; true
      - name: Salvar
        if: always()
        run: |
          git config user.name "fotos-bot"; git config user.email "fotos-bot@users.noreply.github.com"
          git add -A .; git commit -qm "consulta cnpj clientes" || true; git push
